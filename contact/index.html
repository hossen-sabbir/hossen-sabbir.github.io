 <h1 style="font-size: 1.4rem; margin-bottom: 5px;">
    <i class="fas fa-envelope"></i> Get in Touch
</h1>

<div class="contact-content">

    <p class="contact-intro">
        <b>
            Please fill out the form with your query, and I will get back to you.
            You may also reach me directly at:
            <a href="mailto:sabbir.hossen@bu.edu.bd">sabbir.hossen@bu.edu.bd</a>
        </b>
    </p>

    <form
        id="contactForm"
        action="https://formsubmit.co/arefinmusabbir2@gmail.com"
        method="POST"
    >

        <div class="contact-field">
            <label for="name">Full Name</label>
            <input
                id="name"
                class="contact-input"
                name="name"
                type="text"
                placeholder="Enter your name..."
                minlength="2"
                required
            />
        </div>

        <div class="contact-field">
            <label for="email">Email Address</label>
            <input
                id="email"
                class="contact-input"
                name="email"
                type="email"
                placeholder="name@example.com"
                required
            />
        </div>

        <div class="contact-field">
            <label for="phone">Phone Number</label>
            <input
                id="phone"
                class="contact-input"
                name="phone"
                type="tel"
                placeholder="+880 1XXXXXXXXX"
                pattern="[+]?[0-9 ()-]{7,20}"
                title="Please enter a valid phone number."
                required
            />
        </div>

        <div class="contact-field">
            <label for="message">Message</label>
            <textarea
                id="message"
                class="contact-input contact-message"
                name="message"
                placeholder="Enter your message here..."
                minlength="10"
                required
            ></textarea>
        </div>

        <!-- FormSubmit settings -->
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_subject" value="New Contact Form Message">

        <div class="contact-submit">
            <button type="submit" id="submitButton">
                Send Message
            </button>
        </div>

        <!-- Success / Error message -->
        <div
            id="formMessage"
            style="
                display: none;
                margin-top: 15px;
                padding: 12px 15px;
                border-radius: 6px;
                font-size: 14px;
            "
        ></div>

    </form>

</div>


<script>
document.getElementById("contactForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const form = this;
    const button = document.getElementById("submitButton");
    const messageBox = document.getElementById("formMessage");

    // Let browser perform its normal HTML validation first
    if (!form.checkValidity()) {
        form.reportValidity();
        return;
    }

    const email = document.getElementById("email").value.trim();

    // Additional email validation
const emailPattern =
    /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+$/;

if (!emailPattern.test(email)) {
    messageBox.style.display = "block";
    messageBox.style.background = "#f8d7da";
    messageBox.style.color = "#842029";
    messageBox.textContent = "Please enter a valid email address.";
    document.getElementById("email").focus();
    return;
}

const domain = email.split("@")[1].toLowerCase();

// Common invalid/fake domains
const blockedDomains = [
    "gami.com",
    "gmai.com",
    "gmial.com",
    "gmail.co",
    "gmail.cm",
    "yahooo.com",
    "yaho.com",
    "outlok.com",
    "outlook.co"
];

if (blockedDomains.includes(domain)) {
    messageBox.style.display = "block";
    messageBox.style.background = "#f8d7da";
    messageBox.style.color = "#842029";
    messageBox.textContent = "Please enter a valid email address.";
    document.getElementById("email").focus();
    return;
}

    // Disable button while submitting
    button.disabled = true;
    button.textContent = "Sending...";

    messageBox.style.display = "none";

    try {

        const formData = new FormData(form);

        const response = await fetch(form.action, {
            method: "POST",
            body: formData,
            headers: {
                "Accept": "application/json"
            }
        });

        if (response.ok) {

            // Success message
            messageBox.style.display = "block";
            messageBox.style.background = "#d1e7dd";
            messageBox.style.color = "#0f5132";
            messageBox.textContent =
                "✓ Message sent successfully! Thank you for getting in touch.";

            // Clear the form
            form.reset();

        } else {

            throw new Error("Form submission failed.");

        }

    } catch (error) {

        messageBox.style.display = "block";
        messageBox.style.background = "#f8d7da";
        messageBox.style.color = "#842029";
        messageBox.textContent =
            "Sorry, something went wrong. Please try again or email me directly.";

    } finally {

        button.disabled = false;
        button.textContent = "Send Message";

    }

});
</script>
