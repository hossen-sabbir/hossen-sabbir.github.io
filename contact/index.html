<main class="container page">



 



    <h1 style="font-size: 1.4rem; margin-bottom: 5px;">
        <i class="fas fa-envelope"></i> Get in Touch
    </h1>

    <div class="contact-content">

        <p class="contact-intro">
            <b>Please fill out the form with your query, and I will get back to you.
            You may also reach me directly at:
            <a href="mailto:sabbir.hossen@bu.edu.bd">sabbir.hossen@bu.edu.bd</a> </b>
        </p>

        <form action="https://formsubmit.co/arefinmusabbir2@gmail.com" method="POST">

            <div class="contact-field">
                <label for="name">Full Name</label>
                <input
                    id="name"
                    class="contact-input"
                    name="name"
                    type="text"
                    placeholder="Enter your name..."
                    required
                />
            </div>

            <div class="contact-field">
                <label for="email">Email Address</label>
                <input
                    id="email"
                    class="contact-input"
                    name="email"
                    type="email"
                    placeholder="name@example.com"
                    required
                />
            </div>

            <div class="contact-field">
                <label for="phone">Phone Number</label>
                <input
                    id="phone"
                    class="contact-input"
                    name="phone"
                    type="tel"
                    placeholder="(123) 456-7890"
                    required
                />
            </div>

            <div class="contact-field">
                <label for="message">Message</label>
                <textarea
                    id="message"
                    class="contact-input contact-message"
                    name="message"
                    placeholder="Enter your message here..."
                    required
                ></textarea>
            </div>

            <input type="hidden" name="_captcha" value="false">

            <div class="contact-submit">
                <button type="submit">Send Message</button>
            </div>

        </form>

    </div>
